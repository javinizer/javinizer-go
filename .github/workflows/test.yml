name: Test & Coverage

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GO_VERSION_FILE: go.mod

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Fast unit tests and coverage
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Detect act environment
      id: detect
      run: |
        if [ -n "$ACT" ]; then
          echo "running_in_act=true" >> $GITHUB_OUTPUT
          echo "Running in act (local testing mode)"
        else
          echo "running_in_act=false" >> $GITHUB_OUTPUT
          echo "Running in GitHub Actions"
        fi

    - name: Download dependencies
      run: go mod download

    - name: Verify real DMM browser cookies and rendering with an offline fixture proxy
      env:
        JAVINIZER_TEST_NATIVE_DMM_BROWSER: '1'
      run: |
        set -euo pipefail
        CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
        export CHROME_BIN
        test -n "$CHROME_BIN"
        "$CHROME_BIN" --version
        go test -count=1 -timeout=120s -v -covermode=atomic \
          -coverprofile=coverage-dmm-browser.out ./internal/scraper/dmm \
          -run '^TestNativeBrowserScrapeURLCookieAndRenderingContract$' \
          2>&1 | tee coverage-dmm-browser.log
        python3 scripts/verify_dmm_browser_coverage.py coverage-dmm-browser.out coverage-dmm-browser.log \
          | tee coverage-dmm-browser-proof.json

    - name: Archive native DMM browser diagnostics even on failure
      if: always() && steps.detect.outputs.running_in_act != 'true'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: coverage-dmm-browser-diagnostics
        path: |
          coverage-dmm-browser.log
          coverage-dmm-browser.out
          coverage-dmm-browser-proof.json
        if-no-files-found: warn
        retention-days: 30

    - name: Verify primary Undo native-volume and subprocess coverage evidence
      env:
        PRIMARY_UNDO_SUBPROCESS_COVERPROFILE: ${{ github.workspace }}/coverage-primary-undo-linux-child.out
        JAVINIZER_TEST_SECOND_VOLUME: /dev/shm
      run: |
        set -o pipefail
        stat -c '%d %n' "$JAVINIZER_TEST_SECOND_VOLUME" "${TMPDIR:-/tmp}"
        test "$(stat -c '%d' "$JAVINIZER_TEST_SECOND_VOLUME")" != "$(stat -c '%d' "${TMPDIR:-/tmp}")"
        go test -short -count=1 -v -covermode=atomic \
          -coverprofile=coverage-primary-undo-linux.out ./internal/history \
          -run '^(TestPrimaryUndoMissingWorkingDirectorySubprocess|TestPrimaryUndoNativeCrossVolumeReverter)$' \
          | tee coverage-primary-undo-linux.log
        grep -F -- '--- PASS: TestPrimaryUndoNativeCrossVolumeReverter ' coverage-primary-undo-linux.log
        test -s coverage-primary-undo-linux.out
        test -s coverage-primary-undo-linux-child.out
        go tool cover -func=coverage-primary-undo-linux-child.out

    - name: Archive primary Undo subprocess coverage
      if: steps.detect.outputs.running_in_act != 'true'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: coverage-primary-undo-linux-subprocess
        path: |
          coverage-primary-undo-linux.out
          coverage-primary-undo-linux-child.out
        if-no-files-found: error
        retention-days: 30

    - name: Upload primary Undo subprocess coverage to Codecov
      if: steps.detect.outputs.running_in_act != 'true'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        files: ./coverage-primary-undo-linux.out,./coverage-primary-undo-linux-child.out
        disable_search: true
        flags: unittests
        name: codecov-primary-undo-linux-subprocess
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        verbose: true

    - name: Run unit tests
      run: go test -v ./...

    - name: Generate coverage report
      run: make coverage

    - name: Generate offline fixture helper coverage
      run: go test -short -count=1 -timeout=120s -covermode=atomic -coverprofile=coverage-testutil.out ./internal/testutil

    - name: Check coverage threshold
      run: ./scripts/check_coverage.sh 75 coverage.out

    - name: Upload coverage to Codecov
      if: steps.detect.outputs.running_in_act != 'true'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        files: ./coverage.out,./coverage-testutil.out,./coverage-dmm-browser.out
        flags: unittests
        name: codecov-javinizer
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        verbose: true

    - name: Archive coverage report
      if: steps.detect.outputs.running_in_act != 'true'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: coverage-report
        path: |
          coverage.out
          coverage-testutil.out
          coverage-dmm-browser.out
          coverage-dmm-browser.log
          coverage-dmm-browser-proof.json
        retention-days: 30

    - name: Display coverage report (act only)
      if: steps.detect.outputs.running_in_act == 'true'
      run: |
        echo "Coverage report generated (skipped upload in act mode)"
        go tool cover -func=coverage.out | tail -20

  # Job 2: Race detector tests (concurrent code)
  race-tests:
    name: Race Detector Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run race detector tests
      run: make test-race

    - name: Verify repeated genre identity under the race detector
      run: >-
        go test -race -short -p=1 -count=5 -timeout=240s
        -run '^TestMovieRepeatedNewGenreResolvesOneDurableIdentity$'
        ./internal/database

  # Job 3: Linting and code quality
  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Run go vet
      run: make vet

    - name: Check internal/api file size guardrail
      run: ./scripts/check_api_file_size.sh 700 internal/api

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
      with:
        # Go 1.26 in go.mod requires a golangci-lint binary built with Go 1.26+;
        # local machines on Go 1.27 additionally need v2.14.0+ for the new
        # export-data format ("export data version 4"). Pin to avoid skew.
        version: v2.14.0
        args: --timeout=5m

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Go code is not formatted:"
          gofmt -d .
          exit 1
        fi

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0

    - name: Run govulncheck
      run: govulncheck ./...

  # Job 4: Windows tests (catches Windows-specific path bugs)
  test-windows:
    name: Unit Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify native Windows primary Undo contracts with coverage
      run: >-
        go test -short -count=1 -v -covermode=atomic
        '-coverprofile=coverage-primary-undo-windows.out' ./internal/history ./cmd/javinizer/commands/actress ./internal/update ./internal/config ./internal/api/core
        -run '^(TestPrimaryUndoWindows.*|TestPrimaryUndoIdentityAdmissionRefusals|TestPrimaryUndoWeakMutationWitnessRefused|TestProvisionUnsupportedBeforeOpeningInput|TestUpgrade_FullReplace|TestShouldReapConfigLock_WindowsOwnPID_Partial|TestShouldReapConfigLock_WindowsOtherPID_Partial|TestPathValidation_SimWin_UNCAllowedButPathMissing|TestNativeWindowsFileIdentityContracts|TestNativeWindowsReparseFallbackContracts|TestNativeWindowsShortPathResolutionContracts|TestNativeWindowsUNCAdmissionContracts)$'

    - name: Archive native Windows primary Undo coverage
      if: ${{ !env.ACT }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: coverage-primary-undo-windows
        path: coverage-primary-undo-windows.out
        if-no-files-found: error
        retention-days: 30

    - name: Upload native Windows primary Undo coverage to Codecov
      if: ${{ !env.ACT }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        files: ./coverage-primary-undo-windows.out
        disable_search: true
        flags: unittests
        name: codecov-primary-undo-windows
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        verbose: true

    # Native before/after regression evidence for 85201f8:
    # https://github.com/javinizer/javinizer-go/actions/runs/38643999346
    - name: Verify fixed native Windows NFO paths and collect coverage
      shell: python {0}
      run: |
        import json, pathlib, subprocess

        result = subprocess.run([
            "go", "test", "-short", "-count=1", "-json", "-covermode=atomic",
            "-coverprofile=coverage-nfo-native-windows.out",
            "./internal/history", "./internal/workflow", "-run", "^TestNFONative",
        ], capture_output=True, text=True)
        pathlib.Path("nfo-native-fixed.jsonl").write_text(result.stdout, encoding="utf-8")
        print(result.stdout, end="")
        print(result.stderr, end="")
        assert result.returncode == 0, "Fixed native Windows NFO tests failed"
        events = [json.loads(line) for line in result.stdout.splitlines() if line.strip()]
        passed = {event.get("Test") for event in events if event["Action"] == "pass"}
        assert not any(event["Action"] == "skip" for event in events), "Native NFO scenarios must not skip"
        for name in ("TestNFONativeWindowsRestoreKeepsVolume", "TestNFONativeWindowsLegacyVolumeLossRefused", "TestNFONativeWindowsSnapshotRetainsVolume"):
            assert name in passed, "Missing native Windows runtime proof: " + name
        coverage = pathlib.Path("coverage-nfo-native-windows.out").read_text().splitlines()
        assert coverage[0] == "mode: atomic" and len(coverage) > 1
        for source in ("internal/history/reverter.go", "internal/workflow/revert_log.go"):
            assert any(source + ":" in line and int(line.split()[-1]) > 0 for line in coverage[1:]), "Missing production coverage: " + source

    - name: Upload native Windows NFO coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        files: ./coverage-nfo-native-windows.out
        disable_search: true
        flags: unittests
        name: codecov-javinizer-nfo-native-windows
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        verbose: true

    - name: Archive native Windows NFO regression evidence
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: nfo-native-windows-evidence
        path: |
          nfo-native-fixed.jsonl
          coverage-nfo-native-windows.out
        if-no-files-found: error
        retention-days: 30

    - name: Verify native Windows dump replacement and coverage
      shell: python {0}
      run: |
        import json, pathlib, platform, subprocess, sys

        assert sys.platform == "win32" and platform.system() == "Windows", "Requires a native Windows runner"
        assert subprocess.check_output(["go", "env", "GOOS"], text=True).strip() == "windows"
        checkout = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
        result = subprocess.run([
            "go", "test", "-short", "-count=1", "-json", "-covermode=atomic",
            "-coverprofile=coverage-r18devdump-windows.out",
            "./internal/r18devdump", "-run", "^TestReplaceFile",
        ], capture_output=True, text=True)
        pathlib.Path("r18devdump-windows-tests.jsonl").write_text(result.stdout, encoding="utf-8")
        print(result.stdout, end="")
        print(result.stderr, end="")
        assert result.returncode == 0, "Native Windows dump replacement tests failed"
        events = [json.loads(line) for line in result.stdout.splitlines() if line.strip()]
        passed = {event.get("Test") for event in events if event["Action"] == "pass"}
        assert not any(event["Action"] == "skip" for event in events), "Replacement proof must not skip"
        required = (
            "TestReplaceFileWindowsInvalidPaths/source",
            "TestReplaceFileWindowsInvalidPaths/destination",
            "TestReplaceFileWindowsMissingSourcePreservesDestination",
            "TestReplaceFileWindowsSharingFailurePreservesAndRetries",
        )
        assert all(name in passed for name in required), "Missing native replacement scenario"
        coverage = pathlib.Path("coverage-r18devdump-windows.out").read_text().splitlines()
        assert coverage[0] == "mode: atomic"
        helper = [line.rsplit(" ", 2) for line in coverage[1:] if "/internal/r18devdump/replace_windows.go:" in line]
        assert helper and all(int(row[2]) > 0 for row in helper), "Every Windows replacement block must be hit"
        statements = sum(int(row[1]) for row in helper)
        assert statements > 0
        pathlib.Path("r18devdump-windows-proof.json").write_text(json.dumps({
            "checkout_sha": checkout, "platform": platform.platform(),
            "required_scenarios": required, "helper_blocks": len(helper),
            "covered_statements": statements, "total_statements": statements,
        }, indent=2), encoding="utf-8")

    - name: Upload native Windows dump replacement coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        files: ./coverage-r18devdump-windows.out
        disable_search: true
        flags: unittests
        name: codecov-r18devdump-windows
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        verbose: true

    - name: Archive native Windows dump replacement proof
      if: ${{ always() && !env.ACT }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: r18devdump-windows-evidence
        path: |
          r18devdump-windows-tests.jsonl
          coverage-r18devdump-windows.out
          r18devdump-windows-proof.json
        if-no-files-found: error
        retention-days: 30

    - name: Verify Windows unit test orchestration contracts
      run: python -m unittest discover -s scripts -p test_run_windows_unit_tests.py -v

    # Isolate the two database-heavy packages without extending their budget.
    - name: Run unit tests
      run: python scripts/run_windows_unit_tests.py

    - name: Archive Windows unit test package evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: windows-unit-package-evidence
        path: windows-unit-evidence/
        if-no-files-found: error
        retention-days: 30

    - name: Repeat Windows nil dependency panic contracts
      id: nil_dependency_contracts
      timeout-minutes: 5
      shell: python {0}
      run: |
        import collections, json, pathlib, subprocess, sys

        sys.stdout.reconfigure(encoding="utf-8")
        evidence = pathlib.Path("nil-dependency-windows")
        evidence.mkdir()
        packages = {
            "github.com/javinizer/javinizer-go/internal/commandutil": {
                "TestCoreDeps_NilReceiverAccessors",
                "TestCoreDeps_NilReceiverAccessors/GetConfig",
                "TestCoreDeps_NilReceiverAccessors/GetRegistry",
                "TestDependencies_GetConfig_PanicsOnNil",
                "TestDependencies_GetRegistry_PanicsOnNil",
            },
            "github.com/javinizer/javinizer-go/internal/api/core": {
                "TestAPIDeps_GetConfig",
                "TestAPIDeps_GetConfig/returns_config_when_set",
                "TestAPIDeps_GetConfig/panics_when_CoreDeps_is_nil",
                "TestAPIDeps_NilCoreDeps_Panics",
            },
        }
        selector = "^(TestCoreDeps_NilReceiverAccessors|TestDependencies_GetConfig_PanicsOnNil|TestDependencies_GetRegistry_PanicsOnNil|TestAPIDeps_GetConfig|TestAPIDeps_NilCoreDeps_Panics)$"
        failures = []
        code = None
        with (evidence / "tests.jsonl").open("wb") as stdout, (evidence / "tests.stderr.log").open("wb") as stderr:
            try:
                process = subprocess.Popen([
                    "go", "test", "-short", "-count=20", "-timeout=120s", "-json",
                    "./internal/commandutil", "./internal/api/core", "-run", selector,
                ], stdout=stdout, stderr=stderr)
            except OSError as exc:
                failures.append("launch failure: " + repr(exc))
            else:
                try:
                    code = process.wait(timeout=180)
                except (subprocess.TimeoutExpired, OSError) as exc:
                    failures.append("wall timeout" if isinstance(exc, subprocess.TimeoutExpired) else "process wait failed: " + repr(exc))
                    # Terminate only this owned Go process and its descendants.
                    try:
                        with (evidence / "taskkill.log").open("wb") as kill_log:
                            killed = subprocess.run(["taskkill", "/PID", str(process.pid), "/T", "/F"],
                                                    stdout=kill_log, stderr=subprocess.STDOUT, timeout=15)
                        if killed.returncode != 0:
                            failures.append("owned process-tree cleanup not confirmed")
                    except (OSError, subprocess.TimeoutExpired) as exc:
                        failures.append("owned process-tree cleanup failed: " + repr(exc))
                    try:
                        code = process.wait(timeout=15)
                    except (subprocess.TimeoutExpired, OSError) as exc:
                        failures.append("owned Go process exit not confirmed: " + repr(exc))
        (evidence / "tests.exit").write_text(str(code) + "\n", encoding="utf-8")
        if code != 0:
            failures.append("go test exit: " + str(code))
        try:
            events = [json.loads(line) for line in (evidence / "tests.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
            actions = {"start", "run", "pause", "cont", "pass", "bench", "fail", "output", "skip"}
            assert all(isinstance(event, dict) and event.get("Package") in packages and event.get("Action") in actions for event in events), "unexpected package or malformed event"
            assert not any(event.get("Action") in ("fail", "skip") for event in events), "failed or skipped event"
            for package, required in packages.items():
                selected = [event for event in events if event.get("Package") == package]
                names = {event["Test"] for event in selected if event.get("Test")}
                assert names == required, "missing or unexpected test names: " + package
                for name in required:
                    counts = collections.Counter(event.get("Action") for event in selected if event.get("Test") == name)
                    assert counts["run"] == counts["pass"] == 20, "incorrect repetition count: " + name
                terminals = [event.get("Action") for event in selected if not event.get("Test") and event.get("Action") in ("pass", "fail", "skip")]
                assert terminals == ["pass"], "missing or duplicate package terminal: " + package
        except (AssertionError, ValueError, TypeError, KeyError, UnicodeError) as exc:
            failures.append("evidence validation: " + str(exc))
        (evidence / "failures.json").write_text(json.dumps(failures, indent=2) + "\n", encoding="utf-8")
        assert not failures, "; ".join(failures)
        print("Verified 100 root passes and 80 child passes across both packages; no skips.")

    - name: Archive Windows nil dependency panic contracts
      if: ${{ always() && steps.nil_dependency_contracts.outcome != 'skipped' }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: nil-dependency-windows
        path: nil-dependency-windows/
        retention-days: 30
        if-no-files-found: error

    - name: Repeat full Windows API server suite in fresh processes
      id: server_lifecycle_repeats
      timeout-minutes: 14
      shell: python {0}
      run: |
        import collections, json, pathlib, subprocess, sys

        sys.stdout.reconfigure(encoding="utf-8")
        evidence = pathlib.Path("server-lifecycle-windows")
        evidence.mkdir()
        package = "github.com/javinizer/javinizer-go/internal/api/server"
        websocket = "TestSecurity_WebSocketOriginValidation"
        required = {
            "TestInjectSSRState_InitializedAuth", "TestDeepIntegration_GenreEndpoints",
            "TestDeepIntegration_JobEndpoints", "TestDeepIntegration_EventEndpoints",
            "TestDeepIntegration_TokenEndpoints", websocket,
            *(websocket + "/" + name for name in (
                "wildcard_is_rejected_for_security_(WebSocket)",
                "empty_config_allows_same-origin", "empty_config_blocks_different_origin",
                "specific_origin_allowed", "specific_origin_blocked",
                "same-origin_allowed_even_when_AllowedOrigins_is_configured",
                "empty_origin_blocked_when_AllowedOrigins_is_configured",
            )),
        }
        failures = []
        for attempt in range(1, 4):
            prefix = evidence / ("attempt-" + str(attempt))
            cleanup_failed = False
            try:
                with prefix.with_suffix(".jsonl").open("wb") as stdout, prefix.with_suffix(".stderr.log").open("wb") as stderr:
                    process = subprocess.Popen([
                        "go", "test", "-short", "-count=1", "-timeout=180s", "-json",
                        "./internal/api/server",
                    ], stdout=stdout, stderr=stderr)
                    try:
                        code = process.wait(timeout=240)
                    except subprocess.TimeoutExpired:
                        failures.append({"attempt": attempt, "reason": "wall timeout"})
                        # Terminate only this owned Go process and its descendants.
                        with prefix.with_suffix(".kill.log").open("wb") as kill_log:
                            try:
                                killed = subprocess.run(["taskkill", "/PID", str(process.pid), "/T", "/F"],
                                                        stdout=kill_log, stderr=subprocess.STDOUT, timeout=15)
                                code = process.wait(timeout=15)
                                cleanup_failed = killed.returncode != 0
                            except Exception as exc:
                                kill_log.write((repr(exc) + "\n").encode("utf-8"))
                                cleanup_failed = True
                                code = process.poll()
                    prefix.with_suffix(".exit").write_text(str(code) + "\n", encoding="utf-8")
                if cleanup_failed:
                    raise RuntimeError("Owned process-tree termination unconfirmed; later attempts withheld")
                output = prefix.with_suffix(".jsonl").read_text(encoding="utf-8")
                print("API server attempt", attempt, "exit", code)
                print(output, end="")
                print(prefix.with_suffix(".stderr.log").read_text(encoding="utf-8"), end="")
                events = [json.loads(line) for line in output.splitlines() if line.strip()]
                passed = [event.get("Package") for event in events if not event.get("Test") and event["Action"] == "pass"]
                if code != 0 or passed != [package] or any(event["Action"] == "fail" for event in events):
                    failures.append({"attempt": attempt, "reason": "test failure or missing package result"})
                for name in required:
                    counts = collections.Counter(event["Action"] for event in events if event.get("Package") == package and event.get("Test") == name)
                    if counts["run"] != 1 or counts["pass"] != 1 or counts["skip"] or counts["fail"]:
                        failures.append({"attempt": attempt, "reason": "missing or skipped critical test", "test": name})
            except Exception as exc:
                prefix.with_suffix(".error.log").write_text(repr(exc) + "\n", encoding="utf-8")
                failures.append({"attempt": attempt, "reason": repr(exc)})
            if cleanup_failed:
                break
        (evidence / "failures.json").write_text(json.dumps(failures, indent=2) + "\n", encoding="utf-8")
        assert not failures, "API server process failures: " + repr(failures)

    - name: Archive Windows API server lifecycle repetitions
      if: ${{ always() && steps.server_lifecycle_repeats.outcome != 'skipped' }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: server-lifecycle-windows
        path: server-lifecycle-windows/
        if-no-files-found: error
        retention-days: 30

    - name: Verify native Windows config publication and initialization
      run: >-
        go test -short -count=20 -v ./internal/config
        -run '^(TestAtomicReplace_WindowsSharingViolationPreservesCommittedConfig|TestAtomicReplaceFile_ConcurrentWrites|TestAtomicReplace_(FailuresPreserveCommittedConfig|LeavesDestinationVisibleUntilPublication)|TestLoadOrCreate_(PreservesSaveAfterMissingStat|HoldsLockThroughInitDefaults|ConcurrentInitializersPreserveWinner|InitialConfigIsPublishedOnlyWhenComplete))$'

    - name: Verify resident aliases on the native Windows filesystem
      run: >-
        go test -short -count=1 -v ./internal/workflow
        -run '^TestResidentPrimaryCaseAliasRepeatAndUndo/native=true/'

    - name: Verify persisted resident-publication recovery on Windows
      run: >-
        go test -short -count=1 -v ./internal/workflow ./internal/history ./internal/fsutil
        -run '^(TestResidentPublication|TestPublicationRecovery|TestRecoverPublicationMove|TestBoundRecoveryIdentity|TestStationaryPrimary|TestWrapperCopy|TestReproofStreamedSource)'

    - name: Verify Windows dump stall phase regressions
      run: >-
        go test -short -count=1 -v ./internal/api/r18devdump
        -run '^(TestStartDownload_(SlowButSteadySucceeds|StallAborts|HeadersStallAborts)|TestStallWatchdog)'

    - name: Repeat Windows dump cancellation lifecycle regressions
      run: >-
        go test -short -count=10 -timeout=120s -v ./internal/r18devdump ./internal/api/r18devdump
        -run '^(TestImport_(CancellationWaitsForRollback|CanceledBeforeCommitRollsBack|CanceledAfterSchemaDoesNotBegin|CanceledDuringBeginDoesNotRead|CanceledStreamCleansUpAndRetries)|TestStartDownload_StallAborts)$'

    - name: Verify in-place resident directory compensation on Windows
      run: >-
        go test -short -count=1 -v ./internal/workflow ./internal/history
        -run '^(TestIndependent(NativeWindowsCaseAliasDirectoryUndo|InPlaceResidentDirectoryUndo|ResidentDirectory|ResidentInterruptedDirectoryUndo|DirectoryUndo|CopyIntentBoundary)|TestInPlaceResidentDirectoryArtifactUndo|TestResidentNativeIdentitySnapshot|TestResidentNestedArtifactDirectoryUndo|TestIndependentResident(CaseOnlyDirectoryNestedCleanup|CleanupKeepsEmptyRootAndOutsideParents)|TestResidentCleanup)'

    - name: Verify Windows artifact regressions with native-volume evidence
      run: >-
        go test -short -count=1 -v ./internal/workflow ./internal/organizer ./internal/fsutil
        -run '^(TestArtifactStage(NativeCrossDeviceDestination|PlannedMountDestination|InPlacePlannedMount|ReadonlyCrossDeviceDestination|ReadonlyLongFolder|ReadonlyInPlaceStationaryBoundary|ResidentAliasProof|ReadonlyResidentAliases|PlannedDestinationBoundaries)|TestArtifactInPlaceCopy|TestArtifact(InPlaceIgnoresIrrelevantLinkMode|ResidentInPlaceCopyIgnoresIrrelevantLinkMode)|TestNormalizeInPlaceLinkMode|TestPrepareArtifactNormalizesInPlaceLinkMode|TestArtifactSubtitle|TestStaged(Subtitle|Video)|TestCollectStagedSubtitle|TestDeferredSubtitleErrorNeverPublishesFallback|TestDeferredCopyPublishesAdmittedSubtitleDespitePostOpenSwap|TestStagingPathBudgetIsLocalAndSigned|TestCopyFileNoReplaceVerifiedSourceHandleClosedOnReturn|TestOpenVerifiedSourcePinSharesDelete|TestNativeArtifactCrossDeviceError|TestAdversarial(PrimaryModeCrossProduct|SidecarModeCrossProduct|NonOrganizeModeCrossProduct))'

  # Focused native Darwin coverage; does not provision a second volume.
  primary-undo-macos:
    name: Primary Undo Contracts (macOS)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false

    # Fetch the unchanged pin via Git while hosted action archive downloads return 404.
    # Keep this ref and the verification SHA below in sync with the other setup-go pins.
    - name: Checkout pinned Go setup action
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        repository: actions/setup-go
        ref: 924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        path: .ci-actions/setup-go
        persist-credentials: false
        fetch-depth: 1

    - name: Verify pinned Go setup action
      shell: bash
      run: |
        set -euo pipefail
        test -d .ci-actions/setup-go/.git
        test "$(git -C .ci-actions/setup-go rev-parse HEAD)" = 924ae3a1cded613372ab5595356fb5720e22ba16
        git -C .ci-actions/setup-go diff --exit-code HEAD --
        status="$(git -C .ci-actions/setup-go status --porcelain --untracked-files=all --ignored)"
        test -z "$status"
        test -s .ci-actions/setup-go/action.yml
        test -s .ci-actions/setup-go/dist/setup/index.js
        test -s .ci-actions/setup-go/dist/cache-save/index.js

    - name: Set up Go
      uses: ./.ci-actions/setup-go
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify native Darwin primary Undo contracts with coverage
      run: >-
        go test -short -count=1 -v -covermode=atomic
        -coverprofile=coverage-primary-undo-macos.out
        ./internal/history ./internal/fsutil ./internal/models ./internal/database ./internal/workflow
        -run '^(TestPrimaryUndo|TestReviewPrimaryUndo|TestDurableJournal|TestDurableStaging|TestDarwinExclusiveRename|TestDarwinUnsupportedEINVALDoesNotTriggerCopy|TestDarwinVerifiedSubstitutionAndRestore|TestVacateLinkObject|TestRestoreSourceW22_IdentitySwapRefused$|TestW10RearmReplacementBackup_RegularFileUnchanged$)'

    - name: Archive native Darwin primary Undo coverage
      if: ${{ !env.ACT }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: coverage-primary-undo-macos
        path: coverage-primary-undo-macos.out
        if-no-files-found: error
        retention-days: 30

    - name: Upload native Darwin primary Undo coverage to Codecov
      if: ${{ !env.ACT }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        files: ./coverage-primary-undo-macos.out
        disable_search: true
        flags: unittests
        name: codecov-primary-undo-macos
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        verbose: true

  # Job 5: Frontend Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/frontend/package-lock.json

    - name: Install frontend dependencies
      run: npm ci --prefix web/frontend

    - name: Generate Paraglide messages
      run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      working-directory: web/frontend

    - name: Run frontend tests
      run: npm run test --prefix web/frontend

  # Job 6: Build verification
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/frontend/package-lock.json

    - name: Install frontend dependencies
      run: npm ci --prefix web/frontend

    - name: Resolve version
      id: version
      run: |
        version="$(./scripts/version.sh)"
        if [ -z "$version" ]; then
          echo "Failed to resolve version"
          exit 1
        fi
        echo "value=$version" >> "$GITHUB_OUTPUT"

    - name: Download dependencies
      run: go mod download

    - name: Build CLI
      run: make build

    - name: Install swag
      run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

    - name: Generate Swagger documentation
      run: export PATH=$PATH:$(go env GOPATH)/bin && make swagger

    - name: Verify swagger files are up to date
      run: |
        if [ -n "$(git status docs/swagger/ --porcelain)" ]; then
          echo "⚠️  Swagger documentation is out of date"
          echo "Run 'make swagger' and commit the changes"
          echo ""
          git status docs/swagger/
          exit 1
        fi
      shell: bash

    - name: Verify mockery mocks are up to date
      run: make check-mocks
      shell: bash

    - name: Verify binary
      run: |
        set -euo pipefail
        if [ ! -f bin/javinizer ]; then
          echo "Binary not created"
          exit 1
        fi
        chmod +x bin/javinizer
        binary_version="$(./bin/javinizer version --short)"
        expected="${{ steps.version.outputs.value }}"
        if [ "${binary_version}" != "${expected}" ]; then
          echo "Binary version mismatch: got '${binary_version}', want '${expected}'"
          exit 1
        fi
        echo "Binary version OK: ${binary_version}"

    - name: Verify embedded web UI
      shell: bash
      run: |
        set -euo pipefail
        ./bin/javinizer web --host 127.0.0.1 --port 18080 > /tmp/javinizer-web.log 2>&1 &
        pid=$!
        trap 'kill "${pid}" >/dev/null 2>&1 || true' EXIT

        for _ in $(seq 1 30); do
          if curl --silent --fail http://127.0.0.1:18080/health >/dev/null; then
            break
          fi
          sleep 1
        done

        homepage="$(curl --silent --fail -H 'Accept: text/html' http://127.0.0.1:18080/)"
        if printf '%s' "${homepage}" | grep -q 'Javinizer Web UI Placeholder'; then
          echo "Binary is serving the placeholder web UI instead of the bundled frontend"
          echo "Server log:"
          cat /tmp/javinizer-web.log
          exit 1
        fi

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Resolve version
      id: version
      run: |
        version="$(./scripts/version.sh)"
        if [ -z "$version" ]; then
          echo "Failed to resolve version"
          exit 1
        fi
        echo "value=$version" >> "$GITHUB_OUTPUT"

    - name: Resolve build date
      id: build_date
      run: echo "value=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
    - name: Build Docker image
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        load: true
        push: false
        tags: javinizer:test
        build-args: |
          VERSION=${{ steps.version.outputs.value }}
          COMMIT=${{ github.sha }}
          BUILD_DATE=${{ steps.build_date.outputs.value }}

    - name: Verify Docker metadata and version output
      run: |
        set -euo pipefail
        expected="${{ steps.version.outputs.value }}"
        binary_version="$(docker run --rm --entrypoint /usr/local/bin/javinizer javinizer:test version --short)"
        if [ "${binary_version}" != "${expected}" ]; then
          echo "Docker binary version mismatch: got '${binary_version}', want '${expected}'"
          exit 1
        fi
        image_version="$(docker inspect javinizer:test --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
        if [ "${image_version}" != "${expected}" ]; then
          echo "Docker image label version mismatch: got '${image_version}', want '${expected}'"
          exit 1
        fi

  # Job 7: i18n catalog validation (design doc §10.1). Verifies both the
  # frontend Paraglide catalog and the TUI go-i18n catalog: JSON parses,
  # canonical BCP 47 filenames, sorted/duplicate keys, missing + stale keys,
  # placeholder + plural-selector parity, TUI description/other/one fields,
  # split-key _one/_other remnants, per-surface coverage, and that the
  # Paraglide generated output compiles for every locale.
  i18n-check:
    name: i18n Catalog Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/frontend/package-lock.json

    - name: Install frontend dependencies
      run: npm ci --prefix web/frontend

    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Run i18n catalog validation
      run: make i18n-check

  # Job: Fullstack E2E — real browser → real SvelteKit frontend → real HTTP
  # transport → real Go API server (cmd/javinizer-e2e with the deterministic
  # e2emock scraper substituted at the scraper seam) → real worker pipeline →
  # real :memory: SQLite. Hermetic + deterministic: no real network scraping.
  # Playwright's webServer spawns both `go run ./cmd/javinizer-e2e` (on :18080)
  # and the Vite dev server (on :5175), killing both on teardown.
  # Gate merge: set this job as a required status check in branch protection.
  fullstack-e2e:
    name: Fullstack E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/frontend/package-lock.json

    - name: Install frontend dependencies
      run: npm ci --prefix web/frontend

    - name: Download Go dependencies
      run: go mod download

    - name: Install Playwright browsers
      working-directory: web/frontend
      run: npx playwright install --with-deps chromium

    - name: Run fullstack E2E suite
      id: fullstack
      run: make test-e2e-fullstack

    - name: Run offline name sync lifecycle suite
      id: offline_sync
      if: ${{ !cancelled() && (success() || steps.fullstack.outcome == 'failure') }}
      run: make test-e2e-offline-sync

    - name: Repeat offline sync cancellation ordering
      if: ${{ !cancelled() && steps.offline_sync.outcome == 'success' }}
      working-directory: web/frontend
      run: npx playwright test --config=playwright.sync.config.ts --grep 'partial cancellation' --repeat-each=5 --output=test-results-sync/cancellation-repeat

    - name: Upload offline sync browser evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: offline-name-sync-browser-evidence
        path: web/frontend/test-results-sync/
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: fullstack-e2e-artifacts
        path: |
          web/frontend/test-results/
          web/frontend/playwright-report/
        if-no-files-found: ignore
        retention-days: 30

  # Job: Frontend-only E2E — mocked API (page.route), NO backend. Fast +
  # deterministic: pins pure frontend rendering + interaction logic + env-gated
  # UI states (e.g. install_environment=desktop) that the fullstack CLI backend
  # can't produce. Spawns only the Vite dev server. One of three Playwright
  # distinctions: frontend-only (this), fullstack-e2e (real backend), and
  # local-only live scrapers (test/e2e/live, never in CI).
  frontend-e2e:
    name: Frontend-only E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/frontend/package-lock.json

    - name: Install frontend dependencies
      run: npm ci --prefix web/frontend

    - name: Install Playwright browsers
      working-directory: web/frontend
      run: npx playwright install --with-deps chromium

    - name: Run frontend-only E2E suite
      run: make test-e2e-frontend

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: frontend-e2e-artifacts
        path: |
          web/frontend/test-results/
          web/frontend/playwright-report/
        if-no-files-found: ignore
        retention-days: 30

  # Job: Static-flavor E2E — serves the production adapter-static build
  # through the real embedded-assets Go binary (web/frontend/build → web/dist
  # → //go:embed all:dist → Gin NoRoute fallback, exactly as Docker/release
  # binaries serve it) and asserts hard page loads render route content with
  # zero __data.json server-data requests. This is the deployment flavor the
  # Vite-dev-server suites (frontend-e2e, fullstack-e2e) cannot exercise.
  static-e2e:
    name: Static-flavor E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/frontend/package-lock.json

    - name: Install frontend dependencies
      run: npm ci --prefix web/frontend

    - name: Download Go dependencies
      run: go mod download

    - name: Install Playwright browsers
      working-directory: web/frontend
      run: npx playwright install --with-deps chromium

    - name: Run static-flavor E2E suite
      run: make test-static-e2e

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: static-e2e-artifacts
        path: |
          web/frontend/test-results/
          web/frontend/playwright-report/
        if-no-files-found: ignore
        retention-days: 30

  # Job: CLI E2E — builds the real `javinizer` binary and drives its
  # subcommands (sort, version, --help, --dry-run) end-to-end via os/exec.
  # Hermetic + deterministic: JAVINIZER_E2E_SCRAPERS=true substitutes the
  # offline e2emock scraper at the dependency-injection seam, so no real
  # network scraping happens. This is the CLI counterpart to the fullstack
  # Playwright suite (which drives the API server).
  cli-e2e:
    name: CLI E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Download Go dependencies
      run: go mod download

    - name: Run CLI E2E suite
      run: make test-e2e-cli
