name: Offline Short Tests

on:
  pull_request:
    branches: [master, main, develop]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'internal/**/testdata/**'
      - 'testdata/**'
      - 'configs/config.yaml.example'
      - 'internal/config/config.yaml.example'
      - 'test/**'
      - Makefile
      - scripts/build_offline_test_overlay.py
      - .github/workflows/offline-short.yml
  push:
    branches: [master, main, develop]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'internal/**/testdata/**'
      - 'testdata/**'
      - 'configs/config.yaml.example'
      - 'internal/config/config.yaml.example'
      - 'test/**'
      - Makefile
      - scripts/build_offline_test_overlay.py
      - .github/workflows/offline-short.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  offline-short:
    name: Offline short (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_timeout: 120s
          # Hosted Windows batch and workflow can exceed 300s cumulatively.
          # Only those packages get 600s; others keep their existing budget.
          - os: windows-latest
            package_timeout: 300s
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Set up reviewed Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: true
      - name: Download dependencies before offline runtime
        run: go mod download
      - name: Build verified test-only network overlay
        run: python scripts/build_offline_test_overlay.py --output offline-evidence/_overlay
      - name: Verify native guard and run offline short tests
        shell: python {0}
        run: |
          import collections, json, os, pathlib, subprocess, sys

          sys.stdout.reconfigure(encoding="utf-8")
          evidence = pathlib.Path("offline-evidence").resolve()
          overlay = (evidence / "_overlay" / "overlay.json").as_posix()
          env = os.environ.copy()
          env.update({"GOFLAGS": "'-overlay=" + overlay + "'", "GOTOOLCHAIN": "local",
                      "GOPROXY": "off", "GONOPROXY": "none", "GOSUMDB": "off",
                      "GOVCS": "*:off", "GODEBUG": "netdns=go"})
          for key in ("JAVINIZER_RUN_LIVE_API_TESTS", "JAVINIZER_RUN_FLARESOLVERR_TESTS"):
              env.pop(key, None)

          def run(name, directory, timeout="120s", packages=None):
              audit = evidence / (name + ".audit.log")
              audit.write_text("", encoding="utf-8")
              env["OFFLINE279_AUDIT_LOG"] = str(audit)
              with (evidence / (name + ".jsonl")).open("w", encoding="utf-8") as stdout, \
                   (evidence / (name + ".stderr.log")).open("w", encoding="utf-8") as stderr:
                  try:
                      result = subprocess.run(["go", "test", "-short", "-count=1", "-timeout=" + timeout, "-json", *(packages or ["./..."])],
                                              cwd=directory, env=env, stdout=stdout, stderr=stderr)
                      code = result.returncode
                  except OSError as exc:
                      stderr.write(repr(exc) + "\n")
                      code = 127
              (evidence / (name + ".exit")).write_text(str(code) + "\n", encoding="utf-8")
              events = [json.loads(line) for line in (evidence / (name + ".jsonl")).read_text(encoding="utf-8").splitlines() if line.strip()]
              failures = [event for event in events if event["Action"] == "fail"]
              skips = [event for event in events if event["Action"] == "skip"]
              print(name, "exit", code, "failures", failures, "skips", skips)
              return events, audit.read_text(encoding="utf-8").splitlines(), code

          events, markers, code = run("canaries", "test/offlineguard")
          assert code == 0, "Guard canaries failed"
          required = {"TestExternalBeforeDNS", "TestDirectDialAndUDPWrites", "TestLoopbackAllowed",
                      "TestHTTPExternalTargetBlockedBeforeProxy", "TestHTTPExternalTargetBlockedBeforeSOCKS",
                      "TestInfrastructureProxyEndpointBlocked", "TestHTTPLoopbackAllowed"}
          passed = {event.get("Test") for event in events if event["Action"] == "pass"}
          assert required <= passed, "Missing native guard canaries"
          assert not any(event["Action"] == "skip" for event in events), "Guard canaries cannot skip"
          assert collections.Counter(markers) == {"OFFLINE279_BLOCKED": 26, "OFFLINE279_BLOCKED_HTTP_TARGET": 4}, "Unexpected guard audit"
          if "${{ matrix.os }}" != "windows-latest":
              events, markers, code = run("short-tests", ".", "${{ matrix.package_timeout }}")
              assert code == 0, "Short tests failed; inspect archived JSON and stderr"
              assert not markers, "Short tests attempted external I/O; inspect audit and JSON, do not suppress it"
          else:
              # Derive the complete inventory under the same offline environment.
              env["OFFLINE279_AUDIT_LOG"] = str(evidence / "package-inventory.audit.log")
              pathlib.Path(env["OFFLINE279_AUDIT_LOG"]).write_text("", encoding="utf-8")
              inventory = subprocess.run(["go", "list", "./..."], cwd=".", env=env,
                                         capture_output=True, text=True)
              (evidence / "package-inventory.txt").write_text(inventory.stdout, encoding="utf-8")
              (evidence / "package-inventory.stderr.log").write_text(inventory.stderr, encoding="utf-8")
              (evidence / "package-inventory.exit").write_text(str(inventory.returncode) + "\n", encoding="utf-8")
              assert inventory.returncode == 0, "Could not enumerate all packages"
              assert not pathlib.Path(env["OFFLINE279_AUDIT_LOG"]).read_text(encoding="utf-8"), "Inventory attempted external I/O"
              packages = inventory.stdout.splitlines()
              batch = "github.com/javinizer/javinizer-go/internal/api/batch"
              workflow = "github.com/javinizer/javinizer-go/internal/workflow"
              groups = [
                  ("short-tests-batch", "600s", [package for package in packages if package == batch]),
                  ("short-tests-workflow", "600s", [package for package in packages if package == workflow]),
                  ("short-tests-rest", "300s", [package for package in packages if package not in (batch, workflow)]),
              ]
              flattened = [package for _, _, members in groups for package in members]
              proof = {
                  "inventory": packages,
                  "groups": [{"name": name, "timeout": timeout, "packages": members}
                             for name, timeout, members in groups],
                  "unique_inventory": len(packages) == len(set(packages)),
                  "disjoint": len(flattened) == len(set(flattened)),
                  "exhaustive": collections.Counter(flattened) == collections.Counter(packages),
              }
              (evidence / "package-partition.json").write_text(json.dumps(proof, indent=2) + "\n", encoding="utf-8")
              assert packages and all(packages), "Empty package inventory"
              assert proof["unique_inventory"] and proof["disjoint"] and proof["exhaustive"], "Invalid package partition"
              assert groups[0][2] == [batch] and groups[1][2] == [workflow] and groups[2][2], "Expected batch, workflow and remaining packages"

              # Run every group even if another exits nonzero or emits malformed JSON.
              errors = []
              terminals = []
              for name, timeout, members in groups:
                  try:
                      events, markers, code = run(name, ".", timeout, members)
                      observed = {event["Package"] for event in events if "Package" in event}
                      finished = [event["Package"] for event in events
                                  if not event.get("Test") and event["Action"] in ("pass", "fail", "skip")]
                      terminals.extend(finished)
                      # Package-level skip is Go's normal terminal event for no-test packages.
                      if observed != set(members) or collections.Counter(finished) != collections.Counter(members):
                          errors.append(name + ": missing, extra, or duplicate package events")
                      if code != 0 or any(event["Action"] == "fail" for event in events):
                          errors.append(name + ": test failure")
                      if markers:
                          errors.append(name + ": attempted external I/O")
                  except Exception as exc:
                      errors.append(name + ": " + repr(exc))
              if collections.Counter(terminals) != collections.Counter(packages):
                  errors.append("Aggregate terminal package events do not match inventory")
              (evidence / "package-results.json").write_text(
                  json.dumps({"terminal_packages": terminals, "errors": errors}, indent=2) + "\n", encoding="utf-8")
              assert not errors, "; ".join(errors)
      - name: Archive offline proof
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: offline-short-${{ matrix.os }}
          path: offline-evidence/
          if-no-files-found: error
          retention-days: 30
